name: CI & CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-check:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Vite+ and Node.js
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "24"
          cache: true
          run-install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check code quality (vp check)
        run: vp check

      - name: Run automated tests (vp test)
        run: vp test --run

      - name: Build packages (vp run -r build)
        run: pnpm run build

  deploy:
    name: Deploy to Cloudflare Workers
    needs: [test-and-check]
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Vite+ and Node.js
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "24"
          cache: true
          run-install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend & assets
        run: pnpm run build

      - name: Deploy Worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm run deploy

      - name: Verify Deployment Health & DB Read
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          echo "Verifying production health check endpoint with database read..."
          MAX_RETRIES=5
          RETRY_COUNT=0
          SUCCESS=0
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "Attempt $RETRY_COUNT of $MAX_RETRIES..."
            
            RESPONSE=$(curl -s -w "\n%{http_code}" https://stockly.ohchans.com/api/health \
              -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
              -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
              -H "User-Agent: Stockly-CI-HealthCheck/1.0" \
              -H "Accept: application/json")
            
            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | sed '$d')
            
            echo "HTTP Status: $HTTP_CODE"
            echo "Response: $BODY"
            
            if [ "$HTTP_CODE" -eq 200 ] && echo "$BODY" | grep -q '"status":"ok"' && echo "$BODY" | grep -q '"db":"connected"'; then
              echo "✅ Production health check & DB read verification passed!"
              SUCCESS=1
              break
            fi
            
            echo "Health check failed or DB not ready yet, retrying in 3 seconds..."
            sleep 3
          done
          
          if [ $SUCCESS -ne 1 ]; then
            echo "❌ Production health check failed after $MAX_RETRIES attempts."
            exit 1
          fi

      - name: Skip Deploy Notice
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "⚠️ CLOUDFLARE_API_TOKEN is not configured in repository secrets. Skipping automated deployment."
