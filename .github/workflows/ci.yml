name: CI & CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-check:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Vite+ and Node.js
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "24"
          cache: true
          run-install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check code quality (vp check)
        run: vp check

      - name: Run automated tests (vp test)
        run: vp test --run

      - name: Build packages (vp run -r build)
        run: pnpm run build

  deploy:
    name: Deploy to Cloudflare Workers
    needs: [test-and-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Vite+ and Node.js
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "24"
          cache: true
          run-install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend & assets
        run: pnpm run build

      - name: Deploy Worker
        run: pnpm run deploy

      - name: Cache Playwright Browsers
        if: env.CF_ACCESS_CLIENT_ID != ''
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium & System Dependencies
        if: env.CF_ACCESS_CLIENT_ID != ''
        run: pnpm exec playwright install --with-deps chromium

      - name: Post-Deploy Smoke E2E Test
        if: env.CF_ACCESS_CLIENT_ID != ''
        run: pnpm test:e2e:prod
