<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 背景グラデーション (深いスレート・ティール) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#134e4a" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>

    <!-- 奥のカードのグラデーション -->
    <linearGradient id="backCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0.15" />
    </linearGradient>

    <!-- メインカードのグラデーション -->
    <linearGradient id="frontCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdfa" />
    </linearGradient>

    <!-- スパークル (閃き) のグラデーション -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- ドロップシャドウ -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#042f2e" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- アイコンベース (角丸スクワークル) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- 繊細な内側ハイライトリング -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#2dd4bf" stroke-width="4" stroke-opacity="0.2" />

  <!-- 1. 奥のストックカード (回転して重なりを表現) -->
  <g transform="rotate(7, 280, 270)">
    <rect x="150" y="110" width="220" height="290" rx="28" fill="url(#backCardGrad)" stroke="#5eead4" stroke-width="3" stroke-opacity="0.4" />
  </g>

  <!-- 2. 手前のメインストックカード -->
  <g filter="url(#cardShadow)">
    <rect x="110" y="140" width="240" height="290" rx="30" fill="url(#frontCardGrad)" />

    <!-- カード上部のヘッダーバー（ティール） -->
    <path d="M 110,170 A 30,30 0 0,1 140,140 L 320,140 A 30,30 0 0,1 350,170 L 350,190 L 110,190 Z" fill="#0d9488" />

    <!-- カード内の内省テキストライン（3本） -->
    <rect x="145" y="230" width="170" height="14" rx="7" fill="#0d9488" fill-opacity="0.75" />
    <rect x="145" y="265" width="140" height="14" rx="7" fill="#14b8a6" fill-opacity="0.5" />
    <rect x="145" y="300" width="110" height="14" rx="7" fill="#2dd4bf" fill-opacity="0.4" />

    <!-- カード下部のチェック / 達成ドット -->
    <circle cx="155" cy="370" r="10" fill="#10b981" />
    <circle cx="190" cy="370" r="10" fill="#cbd5e1" />
    <circle cx="225" cy="370" r="10" fill="#cbd5e1" />
  </g>

  <!-- 3. 輝くスパーク / 再発見の閃き (右上のアクセント) -->
  <g filter="url(#shadow)" transform="translate(325, 95)">
    <!-- 4頂点のスター (4-point sparkle) -->
    <path d="M 50,0 Q 50,50 100,50 Q 50,50 50,100 Q 50,50 0,50 Q 50,50 50,0 Z" fill="url(#sparkleGrad)" />
    <!-- 中心コアの白色ハイライト -->
    <circle cx="50" cy="50" r="12" fill="#ffffff" />
  </g>
</svg>